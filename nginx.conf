load_module modules/ngx_http_js_module.so;

events {}

http {
    js_import get_ram.js;

    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /api/get-ram {
            js_content get_ram.getRam;
        }
    }
}
